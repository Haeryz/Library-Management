{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Example</title>

    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    <!-- GSAP and ScrollReveal for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
</head>
<body>
    <!-- Footer Section -->
    <footer>
        <h2>Get in Touch</h2>
        <p>
            Ecosystem bootstrapping learning curve lean startup disruptive.<br>
            Marketing long tail disruptive agile development partner.
        </p>
        
        <!-- Social Media Icons -->
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fab fa-pinterest"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
        </div>

        <!-- Contact Information -->
        <div class="contact-info">
            <div>
                <i class="fas fa-book-open"></i>
                <a href="#" style="color: #f0f6fc; text-decoration: none;">dribbble.com/example</a>
            </div>
            <div>
                <i class="fas fa-envelope"></i>
                <a href="mailto:contact@example.com" style="color: #f0f6fc; text-decoration: none;">contact@example.com</a>
            </div>
        </div>
    </footer>

    <!-- Link to external JavaScript -->
    <script src="{% static 'js/footer.js' %}"></script>
</body>
</html>
